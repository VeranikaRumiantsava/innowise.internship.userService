services:
  userservice:
    image: user_service:latest
    build: .
    ports:
      - "8081:8080"
    depends_on:
      postgres_userservice:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres_userservice
      DB_PORT: 5432
      DB_USER: rumronya
      DB_PASSWORD: password
      DB_NAME: users

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - app_network


  postgres_userservice:
    image: postgres:15
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: rumronya
      POSTGRES_PASSWORD: password
    ports:
      - "5430:5432"
    volumes:
      - pgdata_userservice:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumronya -d users"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app_network


  redis:
    image: redis:7
    container_name: user-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app_network


volumes:
  pgdata_userservice:

networks:
  app_network:
    external: true
